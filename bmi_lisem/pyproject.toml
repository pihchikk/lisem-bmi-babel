[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bmi_lisem"
version = "0.1.0"
description = "Standalone BMI for OpenLISEM with canonical project standard names"
readme = "README.md"
license = {text = "GPLv3"}
authors = [
    {name = "pihchikk", email = "pihchikk@users.noreply.github.com"},
]
keywords = ["hydrology", "erosion", "BMI", "CSDMS", "OpenLISEM"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.20",
    "bmipy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
