[build-system]
build-backend = "mesonpy"
requires = ["cython", "numpy", "meson-python", "wheel"]

[project]
name = "bmi_lisem"
authors = [
  {name = "pihchikk", email = "pihchikk@users.noreply.github.com"},
]
maintainers = [
  {name = "pihchikk", email = "pihchikk@users.noreply.github.com"},
]
description = "PyMT plugin for bmi_lisem"
license = {text = "GPL-3.0-or-later"}
classifiers=[
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
keywords=["bmi", "pymt"]
dynamic = ["version"]
dependencies = [
  "numpy",
]

[project.urls]
homepage = "https://github.com/pihchikk/bmi_lisem"

[project.entry-points."pymt.plugins"]
Lisem = "bmi_lisem._bmi:Lisem"

[project.optional-dependencies]
dev = [
  "meson",
  "meson-python",
  "ninja",
  "nox",
]
docs = [
  "sphinx>=4",
  "sphinx-copybutton",
  "sphinx-inline-tabs",
  "sphinxcontrib.towncrier",
  "pygments>=2.4",
  "sphinx-inline-tabs",
  "furo",
]
testing = [
  "bmi-tester>=0.5.4",
]

[tool.pytest.ini_options]
minversion = "5.0"
testpaths = ["bmi_lisem", "tests"]
norecursedirs = [".*", "*.egg*", "build", "dist"]
addopts = """
    --ignore setup.py
    --tb native
    --strict
    --durations 16
    --doctest-modules
    -vvv
"""
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "IGNORE_EXCEPTION_DETAIL",
    "ALLOW_UNICODE"
]

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
combine_as_imports = true
line_length = 88

[tool.check-manifest]
ignore = [
  "bmi_lisem/data",
  "bmi_lisem/data/**/*",
]

[tool.towncrier]
directory = "news"
package = "bmi_lisem"
filename = "CHANGES.rst"
single_file = true
underlines = "-^\""
issue_format = "`#{issue} <https://github.com/pihchikk/bmi_lisem/issues/{issue}>`_"
title_format = "{version} ({project_date})"
wrap = true

[tool.zest-releaser]
tag-format = "v{version}"
python-file-with-version = "bmi_lisem/_version.py"