[flake8]
exclude = docs
# E221/E241 are deliberate column alignment, not sloppiness: the ALIASES
# legacy->canonical lookup table (tests/test_standard_names.py) and the
# water-balance term reads (tests/test_coupling_vars.py) are aligned so the
# mapping/equation is readable at a glance. Reformatting them to satisfy the
# linter would make a safety-critical lookup table harder to audit -- the whole
# point of that table's own comment is that a legacy name silently resolving to
# the wrong variable is worse than a crash.
# E226 is tight binding around * in expressions like `size*itemsize` and
# `rel_err*100`, which reads better than the spaced form inside f-strings.
ignore =
	E203
	E221
	E226
	E241
	E501
	W503
max-line-length = 88
